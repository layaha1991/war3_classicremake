services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: war3
      POSTGRES_PASSWORD: war3
      POSTGRES_DB: war3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U war3 -d war3"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://war3:war3@postgres:5432/war3
      REDIS_URL: redis://redis:6379
      PUBLIC_WEB_ORIGIN: http://localhost:8080
      STORE_DRIVER: persist
    ports:
      - "2567:2567"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  postgres_data:
