[build]
builder = "NIXPACKS"
# Railway sets NODE_ENV=production during build; without --prod=false pnpm skips vite (devDependency).
buildCommand = "pnpm install --frozen-lockfile --prod=false && pnpm build:deploy"

[deploy]
startCommand = "pnpm --filter @war3/server start"
healthcheckPath = "/api/rooms"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
