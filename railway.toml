[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Use Dockerfile CMD; do not run `vite dev` (5173) — only Colyseus + static on $PORT.
startCommand = "pnpm --filter @war3/server start"
healthcheckPath = "/api/rooms"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
